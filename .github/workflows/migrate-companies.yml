name: Migrate companies to Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-companies-data
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      COMPANY_CHECKPOINT_CACHE: .company-cache/checkpoint.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read last durable GitHub snapshot
        run: |
          git fetch --no-tags origin refs/heads/companies-data
          mkdir -p output/supabase-migration
          git archive FETCH_HEAD | tar -x -C output/supabase-migration
      - name: Migrate and verify full checkpoint
        id: migrate
        run: python scripts/supabase_companies.py migrate --directory output/supabase-migration
      - name: Cache committed initial checkpoint
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .company-cache
          key: companies-checkpoint-${{ steps.migrate.outputs.checkpoint_revision }}
