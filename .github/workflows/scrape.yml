name: Collect public contacts
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum businesses (1-1000; default 50)
        type: number
        default: 50
        required: true
      sources:
        description: Sources JSON path (config/smoke.json for 3-site smoke test)
        type: string
        default: config/sources.json
        required: true
  # Weekly schedule is OFF initially. Uncomment both lines to enable Monday 06:17 UTC.
  # schedule:
  #   - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: contacts-data-branch
  cancel-in-progress: false

jobs:
  collect:
    # Only trusted default-branch code may write the data branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Restore data branch
        id: restore
        run: python scripts/data_branch.py restore
      - name: Collect with incremental checkpoints
        id: scrape
        env:
          BUSINESS_LIMIT: ${{ inputs.limit || '50' }}
          SOURCES_FILE: ${{ inputs.sources || 'config/sources.json' }}
        run: |
          python -m georgia_contacts.cli --limit "$BUSINESS_LIMIT" --sources "$SOURCES_FILE" --max-minutes 24
      - name: Save checkpoint to data branch
        if: always() && steps.restore.outcome == 'success' && steps.scrape.outcome != 'skipped'
        run: python scripts/data_branch.py save
      - name: Upload results (including partial checkpoints)
        if: always() && steps.scrape.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
      - name: Run summary
        if: always()
        run: |
          if [ -f output/report.txt ]; then
            cat output/report.txt >> "$GITHUB_STEP_SUMMARY"
          fi
