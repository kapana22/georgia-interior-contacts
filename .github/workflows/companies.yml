name: Grow company directory
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Recheck completed catalogues now without deleting contacts
        type: boolean
        default: false
      profiles:
        description: Profiles per batch
        type: number
        default: 150
      restart_categories:
        description: Restart only selected catalogue IDs after a parser/source fix
        type: string
        default: ''
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: unified-companies-data
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install collector
        run: python -m pip install -e .
      - name: Restore durable progress
        id: restore
        run: python scripts/companies_pipeline.py restore
      - name: Collect next batch
        id: collect
        env:
          REFRESH_CATALOG: ${{ inputs.refresh && 'true' || 'false' }}
          PROFILE_BATCH: ${{ inputs.profiles || '150' }}
          RESTART_CATEGORIES: ${{ inputs.restart_categories || '' }}
        run: python scripts/companies_pipeline.py collect
      - name: Publish partial progress and company data
        id: save
        if: always() && steps.restore.outcome == 'success' && (steps.collect.outputs.did_work == 'true' || steps.collect.outcome == 'failure')
        run: python scripts/companies_pipeline.py save
      - name: Continue ready work
        if: success() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/companies_pipeline.py resume
